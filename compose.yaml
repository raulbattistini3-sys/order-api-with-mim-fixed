# docker compose up --build
# Then, from attacker/: npm install && npm run demo
services:
  pocketbase:
    build: ./pocketbase
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@local.test}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-change-me-please}
    volumes:
      - pb_data:/pb/pb_data
    ports:
      - "8090:8090" # admin UI at http://localhost:8090/_/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 10s
      retries: 15

  meilisearch:
    image: getmeili/meilisearch:v1.56.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY:-dev-meilisearch-key-change-me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700" # for the API when it runs outside Docker

  api:
    build: { context: ., args: { CMD: api } }
    environment:
      PB_URL: http://pocketbase:8090
      PB_EMAIL: ${PB_ADMIN_EMAIL:-admin@local.test}
      PB_PASSWORD: ${PB_ADMIN_PASSWORD:-change-me-please}
      IMPORT_SPOOL_DIR: /imports
      MEILI_URL: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY:-dev-meilisearch-key-change-me}
    volumes:
      - imports:/imports # queued spreadsheets survive a restart
    ports:
      - "8080:8080" # published only so the demo can attack it directly
    depends_on:
      pocketbase: { condition: service_healthy }
      meilisearch: { condition: service_started }

  gateway:
    build: { context: ., args: { CMD: gateway } }
    environment:
      UPSTREAM: http://api:8080
      PB_URL: http://pocketbase:8090
      PB_EMAIL: ${PB_ADMIN_EMAIL:-admin@local.test}
      PB_PASSWORD: ${PB_ADMIN_PASSWORD:-change-me-please}
      CLIENT_SECRET: ${CLIENT_SECRET:-dev-secret-change-me-0123456789}
      # 30s is the default; 5s keeps the late-replay demo short.
      SIGNATURE_MAX_AGE: ${SIGNATURE_MAX_AGE:-5s}
    ports:
      - "8081:8081"
    depends_on: [api]

volumes:
  pb_data:
  imports:
  meili_data:
