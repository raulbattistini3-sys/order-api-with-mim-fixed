[package]
name = "readcache"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
toml = "0.9.8"

[profile.release]
opt-level = 3
